  <!-- child nodes -->
  <rect x="6"  y="39" width="18" height="14" fill="#fff"/>
  <rect x="40" y="39" width="18" height="14" fill="#fff"/>
  <!-- state tick on right child: the one that propagated -->
  <rect x="40" y="39" width="18" height="4" fill="#E8230A"/>
</svg>
